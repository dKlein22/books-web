{% extends "layout.html" %}

{% block body %}
    <h1>SEARCH BOOKS</h1>

    <form method="get" action="{{ url_for('books.search') }}">
        <input name="query" placeholder="Search..." type="text">

        <select name="criteria">
            <option value="title" {% if criteria == "title" %}selected{% endif %}>Title</option>
            <option value="genre" {% if criteria == "genre" %}selected{% endif %}>Genre</option>
            <option value="author" {% if criteria == "author" %}selected{% endif %}>Author</option>
        </select>

        <button type="submit">Search</button>
    </form>

    <ul>
        {% for book in results %}
            <li>
                {{book['title']}} - {{book['author']}} ({{book['year']}})

                <form action="{{ url_for('books.add_favorites')}}" method="post">
                    <input type="hidden" name="book_id" value="{{ book['id'] }}">
                    <button type="submit">Favorite</button>
                </form>
            </li>
        {% endfor %}
    </ul>

    <a href="{{ url_for('books.favorites')}}">View Favorites</a>
    <a href="{{ url_for('home.home')}}">Menu</a>
        
{% endblock %}
