{% extends "layout.html" %}

{% block body %}
    <div class="d-flex flex-column justify-content-center align-items-center text-center" style="min-height: 80vh;">
        <h1 class="display-4 fw-bold">Your Personal Reading Tracker</h1>
        <p class="lead mb-4">Search books, save your favorites, and keep track of what you want to read next.</p>

        <div>
            <a href="{{ url_for('auth.login') }}" class="btn btn-light btn-lg me-2">Login</a>
            <a href="{{ url_for('auth.register') }}" class="btn btn-outline-light btn-lg">Register</a>
        </div>
    </div>
{% endblock %}
