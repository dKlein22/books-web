{% extends "layout.html" %}

{% block body %}
    <div class="d-flex flex-column justify-content-center align-items-center" style="min-height: 80vh;">
        <h1 class="mb-4">Login</h1>
    
        {% if errors %}
            <div class="alert alert-danger" style="max-width: 400px; width: 100%;">
                <ul class="mb-0">
                    {% for error in errors %}
                        <li>{{error}}</li>
                    {% endfor %}
                </ul>
            </div>
        {% endif %}

        <form method="post" style="max-width: 400px; width: 100%;">
            <input class="form-control mb-3" autocomplete="off" autofocus name="email" placeholder="Email" type="text">
            <input class="form-control mb-3" autocomplete="off" name="password" placeholder="Password" type="password">
            <button class="btn btn-primary w-100" type="submit">Login</button>
        </form>

        <a href="{{ url_for('auth.register') }}">Don't have an account? Register</a>
    </div>
    
{% endblock %}
