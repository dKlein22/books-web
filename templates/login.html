{% extends "layout.html" %}

{% block body %}
    <h1>Login</h1>

    {% if errors %}
        <ul>
            {% for error in errors %}

                <li>{{error}}</li>
            
            {% endfor %}
        </ul>
    {% endif %}

    <form method="post">
        <input autocomplete="off" autofocus name="email" placeholder="Email" type="text">
        <input autocomplete="off" name="password" placeholder="Password" type="password">
        <button type="submit">Login</button>
    </form>
    
{% endblock %}
