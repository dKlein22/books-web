{% extends "layout.html" %}

{% block body %}

    <div  class="d-flex flex-column justify-content-center align-items-center">
        <h1 class="mb-4">FAVORITES</h1>
        <div class="search bg-dark bg-opacity-50 p-4 rounded">
            <ul>
                {% for book in results %}
                <li>
                    {{book['title']}} - {{book['author']}} ({{book['year']}}) Rating: {{book['rating']}}

                    <form action="{{ url_for('books.del_favorites')}}" method="post">
                        <input name="book_id" type="hidden" value="{{ book['id'] }}">
                        <button class="mb-3 btn btn-outline-danger btn-sm" type="submit">Delete</button> 
                    </form>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>

{% endblock %}
